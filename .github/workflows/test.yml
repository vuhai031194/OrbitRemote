# Chạy toàn bộ phép kiểm (npm test) trên Windows, nền chính của Orbit Remote, mỗi lần đẩy lên main hay mở PR.
# Node 22 là bản thấp nhất được hỗ trợ (package.json engines; Node 20 đã hết hạn hỗ trợ 30/4/2026), Node 24 là bản
# các máy đang chạy. Cả hai phải qua.
name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    name: node ${{ matrix.node }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --version
      - run: npm test
